apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wuda-database-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storageSize }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wuda-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wuda-database
  template:
    metadata:
      labels:
        app: wuda-database
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          ports:
            - containerPort: {{ .Values.database.port }}
          envFrom:
            - secretRef:
                name: wuda-secrets
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: wuda-database-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: wuda-database
spec:
  type: ClusterIP
  selector:
    app: wuda-database
  ports:
    - port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
