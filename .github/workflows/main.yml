name: CI/CD Pipeline

on: 
  pull_request:
    branches: [ main ]
  workflow_dispatch:  

jobs:
  source-code-scan:
      name: Code Vulnerability Scan
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v5
        
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Bandit
          run: pip install bandit

        # -r  : recursive
        # -ll : report only medium-level issues or higher
        - name: Run Bandit
          run: bandit -r -ll ./back-end ./front-end

  linting:
      name: Lint Code
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v5
        
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11' 
    
        - name: Install Pylint
          run: pip install pylint
        
        - name: Run Pylint
          run: pylint ./back-end ./front-end


  tests:
      name: Run Tests
      runs-on: ubuntu-latest
      steps:
          - name: Checkout code
            uses: actions/checkout@v5
          
          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.11' 

          - name: Install backend test dependencies
            run: pip install -r ./back-end/requirements_test.txt
        
          - name: Install frontend test dependencies
            run: pip install -r ./front-end/requirements_test.txt
          
          - name: Run backend tests
            run: pytest
            working-directory: ./back-end
           
          - name: Run frontend tests
            run: pytest 
            working-directory: ./front-end
