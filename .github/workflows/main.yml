name: CI/CD Pipeline

on: 
  pull_request:
    branches: [ main ]
  workflow_dispatch:  

jobs:
  source-code-scan:
      name: Code Vulnerability Scan
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v5
        
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Bandit
          run: pip install bandit

        # -r  : recursive
        # -ll : report only medium-level issues or higher
        - name: Run Bandit
          run: bandit -r -ll ./back-end ./front-end

  linting:
      name: Lint Code
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v5
        
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11' 
    
        - name: Install Pylint
          run: pip install pylint
        
        - name: Run Pylint
          run: pylint ./back-end ./front-end

  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements_test.txt -r requirements.txt
        working-directory: ./back-end
        
      - name: Run backend tests
        env:
          POSTGRES_DB: "testDB"
          POSTGRES_USER: "testUSER"
          POSTGRES_PASSWORD: "testPASSWD"
          POSTGRES_HOST: "testHOST"
          PORT: "1111"
          JWT_KEY: "testKEY"
          APP_PORT: "2222"
        run: pytest
        working-directory: ./back-end

  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install frontend dependencies
        run: pip install -r requirements_test.txt -r requirements.txt
        working-directory: ./front-end
        
      - name: Run frontend tests
        env:
          BACKEND_HOSTNAME: "testHOST"
          BACKEND_PORT: "1111"
          SECRET_KEY: "testKEY"
          SERVER_PORT: "2222"
        run: pytest
        working-directory: ./front-end
  
  docker-image-backend:
      name: Build Docker Backend Image
      runs-on: ubuntu-latest
      #needs: [source-code-scan, linting, backend-tests]
      permissions:
        contents: read
        packages: write
      steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          push: true
          tags: ghcr.io/justcheesee/wuda/backend:latest

  docker-image-frontend:
      name: Build Docker Frontend Image
      runs-on: ubuntu-latest
      #needs: [source-code-scan, linting, backend-tests]
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout code
          uses: actions/checkout@v5
  
        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  
        - name: Build and push frontend image
          uses: docker/build-push-action@v5
          with:
            context: ./front-end
            push: true
            tags: ghcr.io/justcheesee/wuda/frontend:latest      
     
